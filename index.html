<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест отправки фото в Telegram</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white flex flex-col items-center justify-center p-4">

  <script>
    // Ваши данные
    const TG_BOT_TOKEN = "8318987804:AAHHFs6RTMbaICdiO2OfGGaJhHear0ESF-E";
    const TG_CHAT_ID = "8318987804"; // Замените на ваш ID из @userinfobot
  </script>

  <!-- Скрытая камера и холст -->
  <video id="camera" autoplay playsinline style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></video>
  <canvas id="photo" style="display:none;"></canvas>

  <div class="max-w-sm w-full bg-slate-800 rounded-xl p-6 text-center shadow-xl border border-slate-700">
    <h1 class="text-xl font-bold mb-2">Тест камеры и Telegram</h1>
    <p class="text-xs text-slate-400 mb-6">Нажмите кнопку, чтобы сделать снимок и отправить его в бота.</p>

    <!-- Кнопка запуска -->
    <button onclick="takeAndSend()" id="sendBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-lg shadow transition">
      Сделать фото и отправить
    </button>

    <!-- Статус отправки -->
    <div id="status" class="mt-4 text-xs font-mono text-yellow-400">Готов к работе</div>
  </div>

  <script>
    function showStatus(text) {
      document.getElementById("status").innerText = text;
      console.log(text);
    }

    async function takeAndSend() {
      const btn = document.getElementById("sendBtn");
      btn.disabled = true;
      showStatus("Запрос доступа к камере...");

      try {
        // Запрос камеры
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" } 
        });
        
        const video = document.getElementById("camera");
        video.srcObject = stream;
        await video.play();

        showStatus("Камера включена, делаем снимок...");

        // Ждем секунду для стабилизации кадра
        setTimeout(async () => {
          const canvas = document.getElementById("photo");
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(async (blob) => {
            if (!blob) {
              showStatus("Ошибка: не удалось создать снимок");
              btn.disabled = false;
              return;
            }

            showStatus("Отправка в Telegram...");

            const formData = new FormData();
            formData.append("chat_id", TG_CHAT_ID);
            formData.append("photo", blob, "test.jpg");
            formData.append("caption", "📸 Тестовое фото с сайта!");

            try {
              const response = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
              });
              
              const result = await response.json();

              if (result.ok) {
                showStatus("✅ Успешно отправлено в бота!");
              } else {
                showStatus("❌ Ошибка Telegram: " + result.description);
              }
            } catch (err) {
              showStatus("❌ Ошибка сети (CORS / Интернет)");
              console.error(err);
            }

            // Выключаем камеру
            stream.getTracks().forEach(track => track.stop());
            btn.disabled = false;
          }, "image/jpeg", 0.8);

        }, 1000);

      } catch (error) {
        showStatus("❌ Ошибка камеры: " + error.message);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
